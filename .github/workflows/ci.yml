name: CI

# Kept small on purpose: the repo is private, so every minute counts against
# the monthly allowance. Pushes run the tests once (current Caddy); the
# three-version matrix and the Docker build check only run weekly, on pull
# requests, or on request.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "caddy/**"
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catch breakage from new Caddy releases early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Rust tests (Caddy ${{ matrix.caddy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        caddy: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["stable", "previous", "beta"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Download Caddy (${{ matrix.caddy }})
        env:
          GH_TOKEN: ${{ github.token }}
          WHICH: ${{ matrix.caddy }}
        run: |
          set -euo pipefail
          tags=$(gh api repos/caddyserver/caddy/releases --paginate -q '.[] | select(.draft | not) | .tag_name')
          stable=$(echo "$tags" | grep -v -- - | sort -V | tail -1)
          case "$WHICH" in
            stable) v=$stable ;;
            previous) minor=$(echo "$stable" | cut -d. -f1,2); v=$(echo "$tags" | grep -v -- - | grep -v "^$minor\." | sort -V | tail -1) ;;
            beta) v=$(echo "$tags" | sort -V | tail -1) ;;
          esac
          echo "Testing against Caddy $v"
          mkdir -p "$RUNNER_TEMP/caddy"
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/$v/caddy_${v#v}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/caddy" caddy
          echo "CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: backend
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log
      - name: Report failed tests
        # Annotations are readable without a GitHub login; the full log is not.
        if: failure()
        working-directory: backend
        run: |
          grep -E "^test .*FAILED|^failures:|panicked at|^  left:|^ right:|assertion|^error(\[|:)" -A 2 test.log | head -80 | while IFS= read -r l; do
            printf '::error::%s\n' "$l"
          done
          { echo "### Failed tests"; echo '```'; grep -E "^test .*FAILED|panicked at|^  left:|^ right:|assertion" -A 2 test.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker images
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build panel
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: Build caddy
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          push: false
