name: Publish panel image

# Builds the panel image and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/caddyhub
# Pushes to main publish :latest; version tags (v1.2.3) also publish :1.2.3.
# amd64 only by default: arm64 is built under emulation and costs a lot of
# Actions minutes, so request it explicitly with "Run workflow".
# The Caddy image has its own workflow that only runs when caddy/ changes.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "caddy/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        default: linux/amd64
        type: choice
        options: [linux/amd64, "linux/amd64,linux/arm64"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddyhub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddyhub
          cache-to: type=gha,mode=max,scope=caddyhub
