# CaddyHub, all in one: the panel runs Caddy inside the same container.
#   1. docker compose up -d          (pulls the prebuilt image)
#   2. open http://<this-host>:8080 and create your admin account
# Set CADDYHUB_SECRET_KEY in a .env file (openssl rand -base64 32) so backups
# stay restorable on another host. To build from source instead of pulling:
#   docker compose build
#
# Upstreams on other stacks: attach their network below (see the commented
# "apps" network), then use container names such as jellyfin:8096.
#
# The two-container layout (separate caddy image) is docker-compose.split.yml.

services:
  caddyhub:
    image: ghcr.io/krifmaz/caddyhub:latest
    build: .
    container_name: caddyhub
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "${CADDYHUB_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
      # Existing certificates from a previous Caddy: mount its data volume here.
      # - caddy_data:/data/caddy-data
      # - ./Caddyfile:/import/Caddyfile:ro   # an old Caddyfile to import
    # networks: [default, apps]

# networks:
#   apps:
#     external: true
#     name: your_other_stack_default

volumes:
  data:
  # caddy_data:
  #   external: true
