name: Publish Caddy image

# Builds the Caddy image (xcaddy + plugins) and pushes it to
#   ghcr.io/<owner>/caddyhub-caddy
# Only when caddy/ changes, or on request. amd64 only by default: the arm64
# build runs under emulation and takes most of an hour of Actions minutes.
# Plugins can be added at runtime from the panel, so this rarely needs to run.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "caddy/**"
      - ".github/workflows/publish-caddy.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        default: linux/amd64
        type: choice
        options: [linux/amd64, "linux/amd64,linux/arm64"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-caddy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        if: contains(inputs.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddyhub-caddy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./caddy
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddyhub-caddy
          cache-to: type=gha,mode=max,scope=caddyhub-caddy
