[package]
name = "caddymium"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Caddymium: a web UI and API that manages a Caddy server"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http1", "json", "query", "form", "tokio"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
bcrypt = "0.19"
aes-gcm = "0.11"
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
subtle = "2"
getrandom = "0.4"
base64 = "0.23"
data-encoding = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
dns-lookup = "4"
if-addrs = "0.15"
ipnet = "2"
regex = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
flate2 = "1"
tar = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
