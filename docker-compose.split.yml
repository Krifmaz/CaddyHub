# Caddymium, two-container layout: the panel and Caddy run in separate
# containers from prebuilt images, talking over an internal network. The
# default (docker-compose.yml) runs both in one container; use this one if
# you want Caddy isolated from the panel.
# Set CADDYMIUM_SECRET_KEY under "Environment variables" (openssl rand -base64 32).
#
# Upstreams on other stacks: attach their network to the caddy service below
# (see the commented "external" network), then use container names such as
# jellyfin:8096 in Caddymium.

services:
  caddy:
    image: ghcr.io/krifmaz/caddymium-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ADMIN_LISTEN: caddy-admin:2019
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddyfile:/etc/caddyhub
      - caddy-bin:/caddy-bin
      - secrets:/run/caddyhub/secrets
      - logs:/var/log/caddy
    networks:
      default: {}
      internal:
        aliases: [caddy-admin]
      # apps: {}

  caddymium:
    image: ghcr.io/krifmaz/caddymium:latest
    restart: unless-stopped
    depends_on: [caddy]
    ports:
      - "${CADDYMIUM_PORT:-8080}:8080"
    environment:
      CADDYMIUM_MANAGE_CADDY: "false"
      CADDYMIUM_SECRET_KEY: ${CADDYMIUM_SECRET_KEY:-}
      CADDYMIUM_CADDY_ADMIN: caddy-admin:2019
      CADDYMIUM_CADDY_BIN: /caddy-bin/caddy
      CADDYMIUM_CADDYFILE: /etc/caddyhub/Caddyfile
      CADDYMIUM_SECRETS_DIR: /run/caddyhub/secrets
      CADDYMIUM_LOG_DIR: /var/log/caddy
      CADDYMIUM_CADDY_DATA: /caddy-data
      CADDYMIUM_CADDY_CONFIG: /caddy-config
      CADDYMIUM_PROBE: caddy:80
      CADDYMIUM_PANEL_UPSTREAM: caddymium:8080
    volumes:
      - caddyhub-data:/data
      - caddyfile:/etc/caddyhub
      - caddy-bin:/caddy-bin             # rw: the plugin manager installs custom builds here
      - secrets:/run/caddyhub/secrets
      - logs:/var/log/caddy:ro
      - caddy-data:/caddy-data:ro
      - caddy-config:/caddy-config:ro      # lets Caddymium import your previous config
      # - ./Caddyfile:/import/Caddyfile:ro  # or mount an old Caddyfile to import
    networks:
      - default
      - internal

networks:
  internal:
    internal: true
  # apps:
  #   external: true
  #   name: your_other_stack_default

volumes:
  caddy-data:
  caddy-config:
  caddyfile:
  caddy-bin:
  secrets:
  logs:
  caddyhub-data:
